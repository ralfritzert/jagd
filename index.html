<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1C3426">
<meta name="robots" content="noindex, nofollow">
<title>Schweisweilerer Jäger</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revier">
<style>
  html, body { margin: 0; height: 100%; background: #1C3426; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #F4F0E6; }
  .hinweis { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #F4F0E6; max-width: 32rem; margin: 0 auto;
    padding: calc(32px + env(safe-area-inset-top)) 20px 32px; }
  .hinweis img { width: 96px; height: 96px; border-radius: 50%; display: block; margin-bottom: 16px; }
  .hinweis b { color: #C9A55C; }
  .hinweis form { margin-top: 24px; }
  .hinweis label { display: block; margin-bottom: 8px; }
  .hinweis input { width: 100%; box-sizing: border-box; font: 16px system-ui, -apple-system, sans-serif; padding: 12px;
    border: 1px solid #C9A55C; border-radius: 8px; background: #F4F0E6; color: #1E2420; }
  .hinweis button { margin-top: 12px; width: 100%; font: 600 16px system-ui, -apple-system, sans-serif; padding: 12px;
    border: 0; border-radius: 8px; background: #C9A55C; color: #1C3426; }
  .hinweis .fehler { color: #F2B8A0; margin-top: 8px; min-height: 1.5em; }
  /* Ladebild: sofort sichtbar, bis die App bei Google geladen ist */
  .lade { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: 24px; background: #1C3426; text-align: center; transition: opacity .2s ease-out; }
  .lade.weg { opacity: 0; pointer-events: none; }
  .lade img { width: 136px; height: 136px; border-radius: 50%; }
  .lade h1 { margin: 0; font: 700 20px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: .08em; text-transform: uppercase; color: #C9A55C; }
  .lade .balken { width: 120px; height: 3px; border-radius: 2px; overflow: hidden; background: rgba(201,165,92,.25); }
  .lade .balken i { display: block; width: 40%; height: 100%; background: #C9A55C; animation: lauf 1.2s ease-in-out infinite; }
  .lade p { margin: 0; min-height: 1.5em; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: rgba(244,240,230,.82); }
  @keyframes lauf { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .lade { transition: none; } .lade .balken i { animation: none; width: 100%; } }
</style>
</head>
<body>
<script>
  // Startseite / installierbare App (PWA): bettet die Jagdmanager-Web-App ein – ohne Google-Hinweisleiste.
  // Der persönliche Schlüssel kommt über ?k= und wird zusätzlich auf diesem Gerät gemerkt,
  // damit die installierte App auch ohne ?k= startet. ?k=… in der Adresse hat immer Vorrang (neuer Link ersetzt alten).
  // BEREITSTELLUNG = ID der Apps-Script-Web-App (öffentlich, steht in jedem Link).
  var BEREITSTELLUNG = 'AKfycbxAZKhoOLhFrNpnasU_0i3qGhHkFNb-K5d7jD3hNBfEnnBURrJN5FEfHQZU_ZgPEYmc';   // Live-Bereitstellung
  var GUELTIG = /^[A-Za-z0-9]{16,64}$/;

  function gemerkt(neu) {
    try {
      if (neu === null) localStorage.removeItem('jagd-k');
      else if (neu) localStorage.setItem('jagd-k', neu);
      return localStorage.getItem('jagd-k') || '';
    } catch (e) { return neu || ''; }
  }

  var param = new URLSearchParams(location.search);
  if (param.has('abmelden')) gemerkt(null);
  var k = param.get('k') || '';
  if (GUELTIG.test(k)) gemerkt(k); else k = gemerkt();

  if (!navigator.onLine) {
    document.body.innerHTML = '<div class="hinweis"><img src="icon-192.png" alt=""><b>Kein Netz</b><br>' +
      'Die Revier-App braucht Empfang. Bitte später erneut öffnen.</div>';
    window.addEventListener('online', function () { location.reload(); });
  } else if (GUELTIG.test(k)) {
    // Ladebild zuerst: Google braucht einige Sekunden, bis die App antwortet
    var lade = document.createElement('div');
    lade.className = 'lade';
    lade.setAttribute('role', 'status');
    lade.innerHTML = '<img src="icon-192.png" alt=""><h1>Schweisweilerer Jäger</h1><div class="balken"><i></i></div><p id="ladetext">Revier wird geladen …</p>';
    document.body.appendChild(lade);
    var ladeWeg = function () {
      if (!lade) return;
      var el = lade; lade = null;
      clearTimeout(langsam); clearTimeout(spaetestens);
      el.classList.add('weg');
      setTimeout(function () { el.remove(); }, 250);
    };
    var langsam = setTimeout(function () { document.getElementById('ladetext').textContent = 'Google braucht gerade etwas länger …'; }, 10000);
    var spaetestens = setTimeout(ladeWeg, 25000);
    // Die App meldet sich, sobald sie etwas zeigt; der Rahmen-Load ist nur die Absicherung (z. B. Fehlerseite von Google)
    window.addEventListener('message', function (e) { if (e.data === 'jagd-bereit') ladeWeg(); });
    var f = document.createElement('iframe');
    f.addEventListener('load', function () { setTimeout(ladeWeg, 2500); });
    f.title = 'Schweisweilerer Jäger';
    f.allow = 'clipboard-write; geolocation';
    f.src = 'https://script.google.com/macros/s/' + BEREITSTELLUNG + '/exec?k=' + encodeURIComponent(k);
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="hinweis"><img src="icon-192.png" alt="">' +
      '<b>Schweisweilerer Jäger</b><br>Bitte den persönlichen Link aus der WhatsApp-Nachricht öffnen.' +
      '<form id="form"><label for="link">Oder den bisherigen persönlichen Link (bzw. nur den Schlüssel) hier einfügen:</label>' +
      '<input id="link" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/…?k=…">' +
      '<button type="submit">Öffnen</button><div class="fehler" id="fehler"></div></form>' +
      'Ohne Link geht es nicht – beim Revierinhaber nachfragen.</div>';
    // Alten Google-Link oder reinen Schlüssel annehmen und auf die eigene Adresse umleiten
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var t = document.getElementById('link').value.trim();
      var m = t.match(/[?&]k=([A-Za-z0-9]{16,64})/) || t.match(/^([A-Za-z0-9]{16,64})$/);
      if (!m) { document.getElementById('fehler').textContent = 'Das ist kein gültiger persönlicher Link.'; return; }
      location.href = location.pathname + '?k=' + m[1];
    });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
